---
showSupportUrl: true
showKnownIssuesUrl: false
showReleaseNotesUrl: false

requirements:
    internetCheckUrl: https://google.com
    requiredStorage: 4
    requiredRam: 0.5
    check:
        - storage
        - ram
        - power
        - internet
        - root
    required:
        - storage
        - ram
        - root

geoip:
    style: xml
    url: https://geoip.kde.org/v1/ubiquity
    selector: CountryCode
