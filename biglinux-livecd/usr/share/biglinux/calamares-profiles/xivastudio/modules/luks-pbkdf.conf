---
# GRUB unlocks the root device itself, so the derivation has to fit in the
# pre-boot environment. 256 MiB with 4 passes keeps Argon2id well above the
# recommended floor while the prompt answers in well under a second; the 1 GiB
# cryptsetup picks on its own costs about four seconds at every boot.
pbkdfMemory: 262144
pbkdfIterations: 4
