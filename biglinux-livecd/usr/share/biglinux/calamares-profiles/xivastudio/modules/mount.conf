---

# Mount the virtual filesystems required by target-system commands. Calamares
# removes these mounts through the umount module when installation finishes.
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [bind]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [bind]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

# Preserve the subvolume layout already used by the BigLinux installer.
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home

btrfsSwapSubvol: /@swap

# BigLinux's default Btrfs policy. The partition module may still select ext4;
# these options are only used when the selected filesystem is Btrfs.
mountOptions:
    - filesystem: default
      options: [defaults]
    - filesystem: efi
      options: [defaults, umask=0077]
    - filesystem: btrfs
      options: [defaults, noatime, compress-force=zstd]
      ssdOptions: [discard=async]
      hddOptions: [autodefrag]
    - filesystem: btrfs_swap
      options: [defaults, noatime]
