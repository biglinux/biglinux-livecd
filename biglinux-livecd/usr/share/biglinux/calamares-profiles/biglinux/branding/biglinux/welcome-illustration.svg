<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280">
  <defs>
    <radialGradient id="ambient" cx="50%" cy="48%" r="50%">
      <stop offset="0" stop-color="#58C9F4" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#2A94D4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2A94D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42C8F5"/>
      <stop offset="0.48" stop-color="#188DCE"/>
      <stop offset="1" stop-color="#0B5598"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#51D1F6" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#51D1F6" stop-opacity="0.38"/>
      <stop offset="0.62" stop-color="#157FC4" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#51D1F6" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur24" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="logoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feFlood flood-color="#0D77B7" flood-opacity="0.36"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fully transparent canvas with a soft, centered visual mass. -->
  <ellipse cx="280" cy="140" rx="220" ry="112" fill="url(#ambient)" filter="url(#blur24)"/>

  <!-- Light trails are deliberately sparse to avoid competing with the UI. -->
  <path d="M76 169 C164 112 345 106 486 153" fill="none" stroke="url(#trail)" stroke-width="7" stroke-linecap="round" filter="url(#blur7)" opacity="0.50"/>
  <path d="M88 183 C208 232 390 211 482 136" fill="none" stroke="url(#trail)" stroke-width="2.6" stroke-linecap="round" opacity="0.72"/>
  <path d="M112 116 C232 73 399 89 458 166" fill="none" stroke="url(#trail)" stroke-width="1.4" stroke-linecap="round" opacity="0.42"/>

  <!-- A restrained orbital ellipse grounds the mark without making a poster. -->
  <ellipse cx="280" cy="157" rx="151" ry="58" fill="none" stroke="#53C9F3" stroke-opacity="0.22" stroke-width="1.5" transform="rotate(-7 280 157)"/>
  <ellipse cx="280" cy="157" rx="177" ry="70" fill="none" stroke="#147DBD" stroke-opacity="0.12" stroke-width="1" transform="rotate(-7 280 157)"/>

