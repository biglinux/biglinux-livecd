<svg xmlns="http://www.w3.org/2000/svg" width="190" height="560" viewBox="0 0 190 560" fill="none">
  <!--
    Rounded corners cannot be masked without shader effects, so every shape
    fades to zero well before it reaches the panel edges.
  -->
  <defs>
    <radialGradient id="baseGlow" cx="0.5" cy="1.02" r="0.72">
      <stop offset="0" stop-color="#42C8F5" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#42C8F5" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#42C8F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="midGlow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#188DCE" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#188DCE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="190" height="560" fill="url(#midGlow)"/>
  <rect width="190" height="560" fill="url(#baseGlow)"/>
</svg>
