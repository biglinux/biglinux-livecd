---

# GRUB asks for the encryption passphrase before it can read grub.cfg, so the
# themed prompt lives in the core image that grub-install just wrote. Running
# this after the bootloader step means the very first boot already has it.
dontChroot: false

script:
    - command: "/usr/share/libalpm/scripts/grub-theme-biglinux-crypt || true"
      timeout: 120

i18n:
    name: "Theme the encryption prompt"
