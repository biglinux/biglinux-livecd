---
# Graphics, Wi-Fi and virtual machine drivers of the installed system, chosen
# by big-driver-manager-cli (replaces the mhwdcfg module and mhwd). It runs on
# the live system with the target as --root: pacman reads the medium's offline
# repository and runs the package hooks inside the target. driver=free or
# nonfree comes from the live kernel command line.
#
# A failure leaves the target on the open source drivers instead of aborting
# the installation, as mhwdcfg did.
dontChroot: true
verbose: true

script:
    - command: "-big-driver-manager-cli gpu install --from-cmdline --root ${ROOT} --pmconfig /opt/mhwd/pacman-mhwd.conf"
      timeout: 1800

i18n:
    name: "Install drivers"
    name[pt_BR]: "Instalar drivers"
