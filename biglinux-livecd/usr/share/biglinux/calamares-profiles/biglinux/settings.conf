---
modules-search: [ local ]

instances:
    - id: initialize_pacman
      module: shellprocess
      config: shellprocess_initialize_pacman.conf
    - id: grub_crypt
      module: shellprocess
      config: shellprocess_grub_crypt.conf

sequence:
    - show:
          - welcomeq
          - locale
          - keyboard
          - partition
          - usersq
          - summaryq
    - exec:
          - partition
          - luks-pbkdf
          - mount
          - unpackfs
          - networkcfg
          - machineid
          - fstab
          - locale
          - keyboard
          - shellprocess@initialize_pacman
          - packages
          - localecfg
          - luksopenswaphookcfg
          - luksbootkeyfile
          - initcpiocfg
          - initcpio
          - usersq
          - displaymanager
          - mhwdcfg
          - hwclock
          - services
          - grubcfg
          - bootloader
          - shellprocess@grub_crypt
          - grubcfg-fix
          - postcfg
          - btrfs-fix
          - umount
    - show:
          - finishedq

branding: biglinux
# The summary page carries the warning this prompt used to show, so the
# extra dialog only repeated what was already on screen.
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
